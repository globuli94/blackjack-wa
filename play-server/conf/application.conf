play.modules.enabled += "modules.BlackjackModule"

# Default secret key for local development (safe to commit)
# Override with PLAY_SECRET environment variable in production
play.http.secret.key = "changeme-in-production-use-env-var" # Default for local dev only
play.http.secret.key = ${?PLAY_SECRET}

# Session configuration for cross-origin cookies
play.http.session {
  secure = true           # Required for SameSite=None
  httpOnly = true         # Security best practice
  sameSite = "none"       # Required for cross-origin cookies
  cookieName = "PLAY_SESSION"
}

# Host filter
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.hosts.allowed = [
  "playserver-eu-85d84ef1cb06.herokuapp.com", 
  ".herokuapp.com",
  "localhost:9000",
  "127.0.0.1:9000",
  "localhost",
  "127.0.0.1",
  "globuli94.github.io"  # Remove https:// from hosts filter
]

# CORS Configuration
play.filters.cors {
  # Allowed origins - must be exact URLs for credentials
  allowedOrigins = [
    "https://globuli94.github.io",
    "http://localhost:8080",
    "http://localhost:5173",
    "http://127.0.0.1:4000",
    "http://192.168.0.229:4000"
  ]
  
  # Allowed HTTP methods
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  
  # Allowed headers
  allowedHttpHeaders = ["Accept", "Content-Type", "Origin", "X-Requested-With", "Authorization"]
  
  # Expose headers (important for cookies)
  exposedHeaders = ["Set-Cookie"]
  
  # Preflight cache
  preflightMaxAge = 1 hour
  
  # CRITICAL FIX: Must be true to allow cookies
  supportsCredentials = true
}

# Firebase Configuration
firebase {
  serviceAccountKey = "serviceAccountKey.json"
  serviceAccountKey = ${?FIREBASE_SERVICE_ACCOUNT_KEY}
}