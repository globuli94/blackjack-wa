@(title: String)(implicit request: RequestHeader)

@import helper._

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>@title</title>
    <link rel="shortcut icon" type="image/png" href='@routes.Assets.versioned("images/favicon.png")'>
    @Html("""
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        """)

    @Html("""
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        """)

    @Html("""
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        """)

    @Html("""
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        """)

    <script src="@routes.Assets.versioned("javascripts/GameUtils.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/GameStateManager.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/APIService.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/UIRenderer.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/WebSocketManager.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/EventHandlers.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/blackjack.js")"></script>
</head>
<body>
    <h1>@title</h1>
    <div class="game-container">
        <div class="game-controls">
                <!-- Wird dynamisch via jQuery gefüllt -->
        </div>

        <div class="dealer-section">
                <!-- Wird dynamisch via jQuery gefüllt -->
        </div>

        <div class="container-fluid">
            <div class="row player-section justify-content-center gx-3 gy-3">
                    <!-- Wird dynamisch via jQuery gefüllt -->
            </div>
        </div>
    </div>

        <!-- Add Player Modal -->
    <div class="modal fade" id="addPlayerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Player</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addPlayerForm">
                    <div class="modal-body">
                        @CSRF.formField
                        <input type="text" id="playerName" name="PlayerForm"
                        class="form-control" placeholder="Enter player name" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
