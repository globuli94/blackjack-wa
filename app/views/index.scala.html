@(gameState: String, gameStateJSON: String)

@main("Blackjack") {
    <div style="color: #cccccc; display: flex; justify-content: center; flex-direction: column; align-items: center">
    <pre>@gameState</pre>
    
    <form action="/command" method="get">
        <input type="text" name="command" placeholder="Enter command">
        <button type="submit">Send</button>
    </form>

    <pre>@gameStateJSON</pre>
    </div>
}
