@import model.gameComponent.GameState.Betting
@import model.gameComponent.GameState.Initialized
@(gameController: controller.controllerComponent.ControllerInterface)(implicit request: RequestHeader)
@import helper._

@main("Blackjack", "home") {
    <div class="game-container">
        <div class="game-controls">
            <!-- Wird dynamisch via jQuery gefüllt -->
        </div>

        <div class="dealer-section">
            <!-- Wird dynamisch via jQuery gefüllt -->
        </div>

        <div class="container-fluid">
            <div class="row player-section justify-content-center gx-3 gy-3">
                <!-- Wird dynamisch via jQuery gefüllt -->
            </div>
        </div>
    </div>

    <!-- Add Player Modal -->
    <div class="modal fade" id="addPlayerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Player</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addPlayerForm">
                    <div class="modal-body">
                        @CSRF.formField
                        <input type="text" id="playerName" name="PlayerForm" 
                               class="form-control" placeholder="Enter player name" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src='@routes.Assets.versioned("javascript/main.js")'></script>
}
